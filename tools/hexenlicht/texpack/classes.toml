# Material classes for texpack (story 5.8): what a class of surface gets when the
# manifest names it. A manifest row picks a class and a short description; the
# row's `overrides` (key=value;key=value) change any key below for its
# textures. Resolution order, least specific first: [defaults], the class, the
# manifest rows whose pattern matches (a literal pattern beats a glob, a longer
# glob a shorter one), the rows' overrides. See README.md.
#
# Keys
#   mode          diffuse: 4x upscale, a diffusion pass, normal and roughness maps
#                 skin: as diffuse, but not tileable (mirrored padding) and a low denoise
#                 sprite: 4x upscale only (sprites take an albedo only, MATERIALS.md)
#                 skip: left alone
#   noun          the surface in one word, for the prompt's default text
#   prompt        {desc} is the manifest's description (else the noun), {noun} the noun
#   negative      the negative prompt
#   denoise       the diffusion pass's strength: 0.20 keeps the upscale, 0.35 invents detail
#   steps, cfg    the sampler's
#   cn_strength   ControlNet Tile's strength: higher holds the upscale's shapes and colors
#   maps          write the normal and roughness/metallic maps and the .mat
#   rough_min, rough_max   the roughness map's range: the model's output is stretched over it
#   metallic      0 or 1 (a metal class sets the B channel of _orm)
#   bump          the .mat's normal strength
#   specular      the .mat's dielectric specular (written only when not 1; 0.25 by default)
#   contrast      a power on the linear luminance (colors scaled with it) before the brightness match (1: none)
#   albedo_ratio  the albedo's mean luminance against the original's, in linear light
#                 (AUTHORING.md section 5: 1 to 1.5 keeps Hexen II's look)
#   kind          the .mat's kind (regular, chrome, glass); regular is not written
#   emissive      the .mat's emissive (0: not written)
#   seed          an override only (seed=1234): the redraw's seed instead of one from the name (story 9.4;
#                 9.5 keeps a hero's pick here)

# The models: names of files in ComfyUI's models folders (the upscaler, the
# checkpoint, the ControlNet), PBRify's map models in $TEXPACK_HOME\models\pbrify.
# 5.8's state keys hash this table: a key added here redoes every upscaled texture.
[models]
upscaler = "4x-PBRify-UpscalerV4.safetensors"
checkpoint = "v1-5-pruned-emaonly.safetensors"
controlnet = "control_v11f1e_sd15_tile_fp16.safetensors"
normal = "1x-PBRify_NormalV3.pth"
roughness = "1x-PBRify_RoughnessV2.pth"
height = "1x-PBRify_Height.pth"
vlm = "qwen3-vl-4b"

# The redraw's model (story 9.4: FLUX.2 klein 4B, M50): the generator, its text encoder and
# VAE, in ComfyUI's folders or one named by $TEXPACK_HOME\extra_model_paths.yaml.
[redraw]
generator = "flux-2-klein-4b-fp8.safetensors"
text_encoder = "qwen_3_4b.safetensors"
vae = "flux2-vae.safetensors"

[defaults]
mode = "diffuse"
noun = "surface"
prompt = "{desc}, seamless tileable game texture, flat even lighting, highly detailed {noun} surface, photographic, sharp focus"
negative = "text, watermark, signature, border, frame, vignette, perspective, strong shadows, gradient lighting, blurry, cartoon, painting, jpeg artifacts"
denoise = 0.28
steps = 24
cfg = 6.0
cn_strength = 1.0
maps = true
rough_min = 0.55
rough_max = 0.9
metallic = 0
bump = 1.0
# Shine and contrast of the dielectric classes (DECISIONS M42, M43). An authored roughness
# makes a surface physically based and a dielectric then reflects 4 % of the lit room
# head-on: where the albedo is near black (the joints of demo1's wall) that reflection is
# all that is seen, a grey veil. specular 0.04 keeps them black; contrast 1.5 raises the
# linear luminance (hue and saturation kept) to that power before the brightness match (the darks go darker, the lit
# faces lighter at the same mean); albedo_ratio 1.2 lifts the mean a little over the
# original's (AUTHORING.md section 5: 1 to 1.5). Measured in the game on the wall: the
# darkest 20 % of the view 0.20 against the original's 1.09 (x1000), the brightest 20 %
# 25 against 17, the mean 7.0 against 6.5. Metals ignore specular; glass, liquids, lava,
# metals and sprites keep specular 1, contrast 1 and ratio 1.
specular = 0.04
contrast = 1.5
albedo_ratio = 1.2
kind = "regular"
emissive = 0

# What a texture is when no manifest row names it: by the export's kind column.
[kind_default]
world = "world"
liquid = "liquid"
skin = "skin"
sprite = "sprite"
sky = "skip"
picture = "skip"

[class.world]
noun = "wall"

[class.stone]
noun = "stone"
rough_min = 0.7
rough_max = 0.95

[class.brick]
noun = "brick"
rough_min = 0.7
rough_max = 0.95

[class.plaster]
noun = "plaster"
rough_min = 0.8
rough_max = 0.98
denoise = 0.24
bump = 0.5      # painted walls: their figures would be embossed in the normal map at 1

[class.wood]
noun = "wood"
rough_min = 0.55
rough_max = 0.85

[class.metal]
noun = "metal"
metallic = 1
specular = 1.0
rough_min = 0.3
rough_max = 0.7
denoise = 0.24
albedo_ratio = 1.0
contrast = 1.0

[class.rust]
noun = "rusted iron"
rough_min = 0.6
rough_max = 0.9
denoise = 0.28

[class.cloth]
noun = "woven fabric"
rough_min = 0.8
rough_max = 0.98

[class.earth]
noun = "earth"
rough_min = 0.85
rough_max = 1.0

[class.foliage]
noun = "foliage"
rough_min = 0.6
rough_max = 0.85

[class.ice]
noun = "ice"
specular = 0.3
rough_min = 0.15
rough_max = 0.5
denoise = 0.24

[class.bone]
noun = "bone"
rough_min = 0.5
rough_max = 0.8

# Glass: a pane is flat, and the maps would emboss the scene painted behind the
# lead into relief; only the kind is written. The albedo keeps that scene, which
# tints the view (AUTHORING.md section 6: paint a new one for a real window).
[class.glass]
noun = "stained glass"
specular = 1.0
albedo_ratio = 1.0
contrast = 1.0
denoise = 0.2
maps = false
kind = "glass"

# Painted things (books, bottles, tools, meat, shop signs, parchment): pictures of objects,
# not a material. A low denoise keeps a bottle a bottle, and little relief.
[class.prop]
noun = "painted object"
prompt = "{desc}, game texture of everyday objects, painted, detailed, photographic, sharp focus"
denoise = 0.2
bump = 0.5
rough_min = 0.5
rough_max = 0.85

# Liquids: the engine warps them and 6.16's caustics read their brightness pattern,
# so the shapes stay: at 0.2 the amber one came out as crumpled foil.
[class.liquid]
noun = "water"
specular = 1.0
albedo_ratio = 1.0
contrast = 1.0
denoise = 0.14
maps = false

[class.lava]
noun = "molten lava"
specular = 1.0
albedo_ratio = 1.0
contrast = 1.0
denoise = 0.22
maps = false

# Symbols (rune switches, element panels): the model must not reinterpret them, a gentle denoise.
[class.rune]
noun = "carved symbol"
denoise = 0.14
rough_min = 0.6
rough_max = 0.9

# Creature and object skins: a UV atlas, not a tile. A low denoise keeps the
# painted shapes (faces, scales, armor plates) where they are.
[class.skin]
mode = "skin"
noun = "creature hide"
prompt = "{desc}, texture map of a game character, detailed {noun}, photographic, sharp focus"
denoise = 0.16
cn_strength = 1.0
rough_min = 0.5
rough_max = 0.85

[class.skin_metal]
mode = "skin"
noun = "armor plate"
specular = 1.0
albedo_ratio = 1.0
contrast = 1.0
prompt = "{desc}, texture map of a game weapon or armor, detailed {noun}, photographic, sharp focus"
denoise = 0.16
metallic = 1
rough_min = 0.3
rough_max = 0.7

# Light, flame, missile and effect models (torches, fire, orbs, bolts, shards): their glow is the
# engine's (X7, R82) and their look is shape and color art, so only the 4x upscale: no
# diffusion pass, no maps, brightness and contrast as they are.
[class.fx]
mode = "sprite"
noun = "effect"
maps = false
specular = 1.0
contrast = 1.0
albedo_ratio = 1.0

[class.sprite]
mode = "sprite"
albedo_ratio = 1.0
contrast = 1.0
maps = false

[class.skip]
mode = "skip"

# Story 9.3's labels (labels.py; README "Labels"): the manifest's purpose and tier columns
# take these words, its regions these materials.
#   purpose (world)  fill: a wall's, floor's or ceiling's main surface; trim: a strip (border,
#                    frieze, step, baseboard); pillar: columns, beams, posts; panel: a framed or
#                    carved unit (a shutter, a slab, an ornament); door, window, grate (bars,
#                    grilles, vents); picture: a painted or carved scene with figures; sign:
#                    lettering, a plaque; symbol: runes, emblems, switch faces; prop: painted
#                    objects (books, bottles, crates); liquid; sky; tool: never drawn
#   purpose (skin)   creature, player, weapon, item (pickups, artifacts), object (props,
#                    statues, furniture), debris (gibs, chunks), fx (lights, flames, missiles)
#   tier             reimagine: a new surface at the same arrangement; layout: every shape
#                    stays; faithful: restored, no new content; glass; liquid; lava; skin;
#                    fx: upscaled only; skip: left as it is
[labels]
purposes_world = ["fill", "trim", "pillar", "panel", "door", "window", "grate", "picture", "sign",
                  "symbol", "prop", "liquid", "sky", "tool"]
purposes_skin = ["creature", "player", "weapon", "item", "object", "debris", "fx"]
tiers = ["reimagine", "layout", "faithful", "glass", "liquid", "lava", "skin", "fx", "skip"]

# The materials a region can be (9.3's regions name them) and, since 9.4, their values texel by
# texel (materials.py; DECISIONS M67): the roughness range the roughness model's output is
# stretched over in the material's texels, metallic, the contrast and the albedo's ratio to the
# original's ([defaults]' where left out: a dielectric with M43's contrast 1.5 and ratio 1.2).
# The ranges are the classes' where a class of the material exists; the rest set by judgment
# from published PBR material tables (polished stone, glazed tile, leather and skin smoother
# than rough stone, cloth and earth). Metals are metallic 1, contrast 1 and ratio 1 (their
# albedo is their reflectance), rust is not a metal (the oxide is a dielectric). Specular is
# the texture's (.mat), not a material's.
[materials]
stone = { what = "rock: rough-hewn, dressed or carved", rough_min = 0.7, rough_max = 0.95 }
marble = { what = "polished veined stone", rough_min = 0.25, rough_max = 0.55 }
brick = { what = "fired clay bricks", rough_min = 0.7, rough_max = 0.95 }
tile = { what = "glazed or fired tiles, mosaic", rough_min = 0.35, rough_max = 0.7 }
plaster = { what = "plaster, stucco, painted wall", rough_min = 0.8, rough_max = 0.98 }
wood = { what = "timber, planks, carved or painted wood", rough_min = 0.55, rough_max = 0.85 }
iron = { what = "wrought or cast iron, dark and dull", metallic = 1, contrast = 1.0, albedo_ratio = 1.0, rough_min = 0.45, rough_max = 0.8 }
steel = { what = "bright worked steel: blades, plate armour", metallic = 1, contrast = 1.0, albedo_ratio = 1.0, rough_min = 0.25, rough_max = 0.55 }
bronze = { what = "bronze or brass", metallic = 1, contrast = 1.0, albedo_ratio = 1.0, rough_min = 0.3, rough_max = 0.65 }
gold = { what = "gold and gilding", metallic = 1, contrast = 1.0, albedo_ratio = 1.0, rough_min = 0.2, rough_max = 0.5 }
silver = { what = "silver", metallic = 1, contrast = 1.0, albedo_ratio = 1.0, rough_min = 0.2, rough_max = 0.5 }
rust = { what = "corroded iron", rough_min = 0.6, rough_max = 0.9 }
cloth = { what = "woven fabric: robes, banners, tapestries", rough_min = 0.8, rough_max = 0.98 }
leather = { what = "tanned leather: straps, bindings, boots", rough_min = 0.5, rough_max = 0.8 }
hide = { what = "a creature's scaly or furless skin", rough_min = 0.45, rough_max = 0.75 }
flesh = { what = "exposed flesh, gore, a face's skin", rough_min = 0.4, rough_max = 0.7 }
bone = { what = "bone, skulls, horn, teeth", rough_min = 0.5, rough_max = 0.8 }
hair = { what = "hair, fur, feathers", rough_min = 0.6, rough_max = 0.9 }
earth = { what = "soil, mud, sand, gravel", rough_min = 0.85, rough_max = 1.0 }
foliage = { what = "grass, leaves, moss, thatch, vines", rough_min = 0.6, rough_max = 0.85 }
ice = { what = "ice, frost", rough_min = 0.15, rough_max = 0.5 }
glass = { what = "glass panes", rough_min = 0.05, rough_max = 0.2 }
crystal = { what = "crystal, gems, glowing stones", rough_min = 0.1, rough_max = 0.35 }
parchment = { what = "paper, parchment, scrolls", rough_min = 0.75, rough_max = 0.95 }
wax = { what = "candle wax", rough_min = 0.4, rough_max = 0.65 }
